<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Protection Systems — Управление IT-инфраструктурой</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>Новые Системы Защиты</h1>
            <p>Проектирование и монтаж систем безопасности</p>
        </div>
    </header>

    <main class="container">
        <section class="contact-section">
            <h2>Оставить заявку</h2>
            <form id="contact-form" action="https://formspree.io/f/xqkvqgzw" method="POST">
                <div class="form-group">
                    <label for="name">Ваше имя:</label>
                    <input type="text" id="name" name="name" required placeholder="Адилет">
                    <small class="error-msg" id="name-error"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Номер телефона (КР):</label>
                    <input type="tel" id="phone" name="phone" required placeholder="0700123456 или +996700123456">
                    <small class="error-msg" id="phone-error"></small>
                </div>

                <div class="form-group">
                    <label for="message">Ваша задача / сообщение:</label>
                    <textarea id="message" name="message" rows="4" required placeholder="Опишите ваш объект..."></textarea>
                    <small class="error-msg" id="message-error"></small>
                </div>

                <button type="submit" id="submit-btn">Отправить заявку</button>
            </form>
            <div id="status-message" class="status-hidden"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
